name: Portable Neovim package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: plugin
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vimkim/cubrid-language-tools
          ref: 2a8842c45c4fb219e322afd731c27937a107324f
          path: core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Prepare receipts
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          printf 'workflow=%s/%s/actions/runs/%s\nsource=%s\nrunner=%s\nimage=%s\ncoverage=portable; native parser success not tested\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_OS" "$ImageVersion" > "$RUNNER_TEMP/receipts/identity.txt"
          git -C plugin status --short --branch >> "$RUNNER_TEMP/receipts/identity.txt"
          git -C core rev-parse HEAD >> "$RUNNER_TEMP/receipts/identity.txt"
          test "$(git -C core rev-parse HEAD)" = 2a8842c45c4fb219e322afd731c27937a107324f
          test -z "$(git -C plugin status --porcelain)"
          python --version >> "$RUNNER_TEMP/receipts/identity.txt"
      - name: Install exact core server
        run: |
          python -m venv "$RUNNER_TEMP/core-env"
          "$RUNNER_TEMP/core-env/bin/python" -m pip install 'setuptools==80.9.0' 'wheel==0.45.1'
          "$RUNNER_TEMP/core-env/bin/python" -m pip wheel --no-build-isolation --no-deps --wheel-dir "$RUNNER_TEMP/wheels" ./core
          sha256sum "$RUNNER_TEMP"/wheels/*.whl > "$RUNNER_TEMP/receipts/core-wheel.sha256"
          wheel=$(find "$RUNNER_TEMP/wheels" -name "*.whl" -print -quit)
          "$RUNNER_TEMP/core-env/bin/python" -m pip install "${wheel}[lsp]"
          "$RUNNER_TEMP/core-env/bin/python" -m pip freeze > "$RUNNER_TEMP/receipts/python-packages.txt"
          "$RUNNER_TEMP/core-env/bin/python" -c 'import cubrid_language; print(cubrid_language.__file__)' >> "$RUNNER_TEMP/receipts/identity.txt"
      - name: Download official Neovim
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          printf '%s  %s\n' bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875 "$RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/nvim.tar.gz" > "$RUNNER_TEMP/receipts/nvim.sha256"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version > "$RUNNER_TEMP/receipts/nvim-version.txt"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Package and verify source correspondence
        working-directory: plugin
        run: |
          scripts/package.sh "$RUNNER_TEMP/receipts/plugin.tar.gz"
          sha256sum "$RUNNER_TEMP/receipts/plugin.tar.gz" > "$RUNNER_TEMP/receipts/plugin.sha256"
          python scripts/verify-package.py "$RUNNER_TEMP/receipts/plugin.tar.gz" > "$RUNNER_TEMP/receipts/package-inventory.txt"
          mkdir "$RUNNER_TEMP/extracted-plugin"
          tar -xzf "$RUNNER_TEMP/receipts/plugin.tar.gz" -C "$RUNNER_TEMP/extracted-plugin"
      - name: Run extracted portable suite
        env:
          CUBRID_TEST_NVIM_VERSION: 0.12.5
        run: |
          CUBRID_TEST_DIR="$RUNNER_TEMP/receipts/portable" CUBRID_TEST_SERVER="$RUNNER_TEMP/core-env/bin/cubrid-language-server" "$RUNNER_TEMP/extracted-plugin/tests/run-portable.sh"
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neovim-portable-receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
